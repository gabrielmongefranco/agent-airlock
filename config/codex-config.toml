# The container is the outer boundary; Codex's Landlock sandbox is a second,
# tool-specific layer. If Codex reports that its sandbox cannot start inside
# the container, change sandbox_mode to "danger-full-access" and rely on the
# container alone.
sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
# Package installs and the local LLM gateway need outbound network from
# inside Codex's sandbox.
network_access = true

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
