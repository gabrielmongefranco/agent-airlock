# Codex's workspace-write sandbox runs its commands under bubblewrap with a
# fresh /proc mount, which a rootless podman container denies ("bwrap: Can't
# mount proc on /proc: Operation not permitted"). Its legacy Landlock mode
# also requires bubblewrap. Codex therefore runs unsandboxed and relies on
# the container, which still limits it to ~/git and the home volume.
sandbox_mode = "danger-full-access"
approval_policy = "on-request"

[sandbox_workspace_write]
# Applies only if sandbox_mode returns to "workspace-write" on a host where
# Codex's sandbox can start. Package installs and the local LLM gateway need
# outbound network from inside that sandbox.
network_access = true

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]
